<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperFilds</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px 20px;
            background: #111;
            border-bottom: 2px solid #4caf50;
        }

        h1 {
            font-size: 42px;
            margin: 0;
        }

        .verde {
            color: #4caf50;
        }

        main {
            padding: 50px 20px;
        }

        .botao {
            display: inline-block;
            padding: 15px 25px;
            margin-top: 20px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .produto {
            margin: 30px auto;
            padding: 25px;
            max-width: 500px;
            background: #151515;
            border-radius: 15px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #111;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>Paper<span class="verde">Filds</span></h1>
        <p>Tecnologia além do comum.</p>
    </header>

    <main>

        <h2>Bem-vindo à PaperFilds</h2>

        <p>
            Smartphones, consoles e tecnologia desenvolvidos
            para ultrapassar limites.
        </p>

        <div class="produto">
            <h2>PaperFilds M99</h2>
            <p>Um dos maiores monstros de desempenho da PaperFilds.</p>
            <a class="botao" href="#">Ver produto</a>
        </div>

    </main>

    <footer>
        © 2026 PaperFilds
    </footer>

</body>
</html>
